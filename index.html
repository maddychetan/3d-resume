<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chetan Holiyappa</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #05070f;
  color: white;
  font-family: Arial, sans-serif;
}

/* HEADER */
#header {
  position: fixed;
  top: 30px;
  left: 80px;
  z-index: 10;
}

#header h1 {
  font-size: 2.2rem;
  letter-spacing: 0.3em;
  color: #2af;
}

/* LINKS */
#top-links {
  position: fixed;
  top: 40px;
  right: 60px;
  display: flex;
  gap: 15px;
}

#top-links a {
  color: white;
  text-decoration: none;
  border: 1px solid rgba(255,255,255,0.3);
  padding: 6px 12px;
  font-size: 0.7rem;
}

/* LEFT STATS */
#side-stats {
  position: fixed;
  left: 40px;
  top: 60%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.stat-num {
  font-size: 3rem;
  color: #2af;
}

.stat-label {
  font-size: 0.8rem;
}

/* ===== FINAL PANEL UI ===== */
#panel {
  position: fixed;
  top: 0;
  right: -420px;
  width: 420px;
  height: 100%;
  background: rgba(10, 15, 35, 0.85);
  backdrop-filter: blur(18px);
  border-left: 1px solid rgba(255,255,255,0.08);
  transition: right 0.4s ease;
  z-index: 50;
  padding: 30px 24px;
  display: flex;
  flex-direction: column;
}

#panel.active {
  right: 0;
}

#panel-content {
  margin-top: 40px;
  overflow-y: auto;
}

#close-btn {
  position: absolute;
  top: 18px;
  right: 18px;
  border: none;
  background: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

#panel h2 {
  font-size: 1.4rem;
  margin-bottom: 10px;
}

#panel p {
  font-size: 0.9rem;
  line-height: 1.6;
  color: rgba(255,255,255,0.8);
}

#panel a {
  color: #2af;
  text-decoration: none;
}
</style>
</head>

<body>

<div id="header">
  <h1>CHETAN HOLIYAPPA</h1>
</div>

<div id="top-links">
  <a href="https://www.linkedin.com/in/caholiyappa/" target="_blank">LINKEDIN</a>
  <a href="#">PORTFOLIO</a>
  <a href="mailto:Chaytonah@gmail.com">EMAIL</a>
</div>

<div id="side-stats">
  <div><div class="stat-num">10+</div><div class="stat-label">YEARS</div></div>
  <div><div class="stat-num">95%</div><div class="stat-label">SUCCESS</div></div>
  <div><div class="stat-num">40%</div><div class="stat-label">EFFICIENCY</div></div>
</div>

<!-- PANEL -->
<div id="panel">
  <button id="close-btn">✕</button>
  <div id="panel-content"></div>
</div>

<script type="module" src="./main.js"></script>

</body>
</html>

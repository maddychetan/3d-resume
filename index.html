  <style>
    :root {
      --blue: #2af;
      --orange: #f60;
      --green: #2d9;
      --purple: #a4f;
      --gold: #fc0;
      --bg: #05070f;
      --surface: rgba(8,12,28,0.96);
      --border: rgba(40,170,255,0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      overflow: hidden;
      font-family: 'Exo 2', sans-serif;
      color: #fff;
      cursor: none;
    }

    canvas { display: block; }

    /* ── Custom Cursor ── */
    #cursor {
      position: fixed; pointer-events: none; z-index: 9999;
      width: 12px; height: 12px;
      background: var(--blue);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.1s, width 0.2s, height 0.2s, background 0.2s;
      box-shadow: 0 0 12px var(--blue);
    }
    #cursor-ring {
      position: fixed; pointer-events: none; z-index: 9998;
      width: 36px; height: 36px;
      border: 1px solid rgba(40,170,255,0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease-out, width 0.3s, height 0.3s;
    }
    body.hovering #cursor { width: 20px; height: 20px; background: var(--orange); box-shadow: 0 0 20px var(--orange); }
    body.hovering #cursor-ring { width: 52px; height: 52px; border-color: rgba(255,102,0,0.4); }

    /* ── Scanlines overlay ── */
    #scanlines {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }

    /* ── Corner HUD decorations ── */
    .hud-corner {
      position: fixed; width: 60px; height: 60px; pointer-events: none; z-index: 6;
    }
    .hud-corner svg { width: 100%; height: 100%; }
    .hud-tl { top: 12px; left: 12px; }
    .hud-tr { top: 12px; right: 12px; transform: scaleX(-1); }
    .hud-bl { bottom: 12px; left: 12px; transform: scaleY(-1); }
    .hud-br { bottom: 12px; right: 12px; transform: scale(-1); }

    /* ── Header ── */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 18px 80px 18px 80px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(180deg, rgba(5,7,15,0.98) 0%, transparent 100%);
      z-index: 10; pointer-events: none;
      border-bottom: 1px solid rgba(40,170,255,0.08);
    }

    .header-left { pointer-events: none; }

    #header h1 {

  font-family: 'Orbitron', monospace;
  font-size: 2.4rem; /* bigger */
  font-weight: 900;
  letter-spacing: 0.3em;

  background: linear-gradient(90deg, #ffffff 0%, #ffffff 100%); /* force white */
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow: 0 0 10px rgba(255,255,255,0.25);
  animation: shimmer 4s ease-in-out infinite;
  background-size: 200%;
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .header-sub {
      font-size: 0.6rem; color: rgba(40,170,255,0.5);
      letter-spacing: 0.4em; margin-top: 4px;
      font-family: 'Orbitron', monospace;
    }

    .header-links { display: flex; gap: 10px; pointer-events: all; }
    .header-links a {
      font-family: 'Orbitron', monospace;
      font-size: 0.55rem; letter-spacing: 0.15em;
      color: var(--blue); text-decoration: none;
      border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 2px;
      background: rgba(40,170,255,0.04);
      transition: all 0.25s;
      position: relative; overflow: hidden;
    }
    .header-links a::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(40,170,255,0.1), transparent);
      transform: translateX(-100%);
      transition: transform 0.4s;
    }
    .header-links a:hover::before { transform: translateX(100%); }
    .header-links a:hover { border-color: var(--blue); color: #fff; background: rgba(40,170,255,0.1); }

    /* ── Status bar ── */
    #statusbar {
      position: fixed; top: 78px; left: 80px; right: 80px;
      display: flex; gap: 24px; align-items: center;
      pointer-events: none; z-index: 10;
    }
   .status-item {
  display: flex;

  font-family: 'Orbitron', monospace;

  letter-spacing: 0.1em;        /* keep same spacing */
}
  .status-dot {
  width: 6px;                   /* was 5px → slightly bigger */

}

    /* ── Avatar / Profile visual ── */

    /* ── Side stats ── */

      pointer-events: none; z-index: 10;
    }
    .stat-block { text-align: center; }
    .stat-num {

      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .stat-label {
      font-family: 'Orbitron', monospace; font-size: 0.4rem;
      color: rgba(40,170,255,0.35); letter-spacing: 0.15em; margin-top: 3px;
    }
    .stat-line { width: 1px; height: 16px; background: linear-gradient(180deg, rgba(40,170,255,0.3), transparent); margin: 0 auto; }

    /* ── Panel ── */
    #panel {
      position: fixed; top: 50%; right: -500px; transform: translateY(-50%);
      width: 430px; max-height: 80vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 0;
      overflow: hidden; z-index: 100;
      transition: right 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: -20px 0 80px rgba(40,170,255,0.06), 0 0 0 1px rgba(40,170,255,0.05);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    }
    #panel.active { right: 20px; }

    #panel-inner {
      height: 100%;
      overflow-y: auto;
      padding: 28px 28px 24px;
      max-height: 80vh;
    }
    #panel-inner::-webkit-scrollbar { width: 3px; }
    #panel-inner::-webkit-scrollbar-thumb { background: rgba(40,170,255,0.3); }

    /* Panel top accent */
    .panel-accent {
      height: 2px;
      background: linear-gradient(90deg, var(--blue), var(--orange), var(--green));
      margin: -28px -28px 24px;
      position: sticky; top: -28px;
    }

    #close-btn {
      position: absolute; top: 16px; right: 16px;
      background: rgba(40,170,255,0.06);
      border: 1px solid rgba(40,170,255,0.2);
      color: rgba(40,170,255,0.6);
      font-family: 'Orbitron', monospace; font-size: 0.6rem;

    }
    #close-btn:hover { background: rgba(255,60,60,0.15); color: #f55; border-color: rgba(255,60,60,0.3); }

    /* Panel content */
    .panel-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }

    /* Timeline */

    .tl-content p { font-size:0.74rem; color:#6677aa; line-height:1.65; margin:0; }

    /* Skill bars */
    .skill-cat { font-family:'Orbitron',monospace; font-size:0.55rem; color:rgba(40,170,255,0.4); letter-spacing:0.2em; margin:16px 0 10px; border-left:2px solid var(--blue); padding-left:8px; }
    .bar-group { display:flex; flex-direction:column; gap:9px; margin-bottom:4px; }
    .bar-item { display:flex; align-items:center; gap:10px; }
    .bar-item span { font-size:0.7rem; color:#8899bb; width:155px; flex-shrink:0; }
    .bar { flex:1; height:3px; background:rgba(255,255,255,0.05); border-radius:0; overflow:hidden; }
    .bar-fill { height:100%; border-radius:0; width:0; transition:width 1.4s cubic-bezier(0.22,1,0.36,1); }

    /* Education */
    .edu-card { display:flex; align-items:flex-start; gap:12px; background:rgba(40,170,255,0.04); border:1px solid rgba(40,170,255,0.12); border-left:2px solid var(--blue); padding:12px 14px; margin-bottom:10px; }
    .edu-icon { font-size:1.4rem; }
    .edu-card strong { font-size:0.78rem; color:#ccddef; font-family:'Orbitron',monospace; letter-spacing:0.04em; }
    .edu-card p { font-size:0.68rem; color:rgba(40,170,255,0.4); margin:3px 0 0; }

    .cert-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:8px; }
    .cert { background:rgba(170,68,255,0.05); border:1px solid rgba(170,68,255,0.15); padding:8px 10px; font-size:0.7rem; color:#ccaaff; line-height:1.4; }
    .cert small { color:rgba(170,68,255,0.4); font-size:0.6rem; display:block; margin-top:2px; }

    /* Awards */
    .award-card { display:flex; gap:14px; border-left:2px solid; padding:12px 14px; margin-bottom:10px; background:rgba(255,255,255,0.015); }
    .award-year { font-family:'Orbitron',monospace; font-size:0.9rem; font-weight:900; color:rgba(40,170,255,0.25); min-width:36px; padding-top:2px; }
    .award-card strong { font-size:0.78rem; color:#ccddef; display:block; margin-bottom:5px; font-family:'Orbitron',monospace; letter-spacing:0.03em; }
    .award-card p { font-size:0.72rem; color:#6677aa; line-height:1.6; margin:0; }
  </style>
</head>

  <script>
    // Custom cursor
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    let mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; cursor.style.left = mx + 'px'; cursor.style.top = my + 'px'; });
    function animRing() { rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(animRing); }
    animRing();
    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
    });
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chetan Holiyappa | 3D Resume</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --blue:#2af;
  --orange:#f60;
  --bg:#05070f;
}

body {
  margin:0;
  background:var(--bg);
  font-family:'Exo 2', sans-serif;
  color:#fff;
  overflow:hidden;
}

/* PARTICLES */
#particles{
  position:fixed;
  inset:0;
  z-index:1;
}

/* CANVAS */
canvas { display:block; position:relative; z-index:0; }

/* CURSOR AURA */
#aura{
  position:fixed;
  width:200px;
  height:200px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,rgba(40,170,255,0.25),transparent 70%);
  transform:translate(-50%,-50%);
  z-index:2;
}

/* HEADER */
#header{
  position:fixed;
  top:0; left:0; right:0;
  padding:30px 90px;
  z-index:10;
}

#header h1{
  font-family:'Orbitron';
  font-size:3rem;
  letter-spacing:0.5em;
  background:linear-gradient(90deg,#2af,#fff,#f60);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 35px rgba(40,170,255,0.6);
}

.header-sub{
  font-size:1.1rem;
  letter-spacing:0.4em;
  color:#fff;
  margin-top:10px;
}

/* SIDE STATS */
#side-stats{
  position:fixed;
  left:80px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:40px;
  z-index:20;
  animation:slideInLeft 1s ease-out;
}

.stat-num{
  font-family:'Orbitron';
  font-size:4.2rem;
  font-weight:900;
  color:#2af;
  text-shadow:
    0 0 20px rgba(40,170,255,1),
    0 0 50px rgba(40,170,255,0.8),
    0 0 100px rgba(40,170,255,0.4);
  animation:glowPulse 2.5s infinite;
}

.stat-label{
  font-size:1rem;
  letter-spacing:0.25em;
  color:#fff;
}

.stat-line{
  width:2px;
  height:24px;
  background:linear-gradient(180deg,rgba(40,170,255,0.6),transparent);
  margin:0 auto;
}

/* ANIMATIONS */
@keyframes glowPulse{
  0%,100%{text-shadow:0 0 20px rgba(40,170,255,0.7);}
  50%{text-shadow:0 0 60px rgba(40,170,255,1);}
}

@keyframes slideInLeft{
  from{ transform:translate(-120px,-50%); opacity:0;}
  to{ transform:translate(0,-50%); opacity:1;}
}
</style>
</head>

<body>

<!-- PARTICLES -->
<canvas id="particles"></canvas>

<!-- CURSOR AURA -->
<div id="aura"></div>

<!-- HEADER -->
<div id="header">
  <h1>CHETAN HOLIYAPPA</h1>
  <p class="header-sub">AI-DRIVEN TALENT ARCHITECT / GLOBAL HIRING / 10+ YEARS</p>
</div>

<!-- SIDE STATS -->
<div id="side-stats">
  <div>
    <div class="stat-num">10+</div>
    <div class="stat-label">YEARS EXPERIENCE</div>
  </div>
  <div class="stat-line"></div>

  <div>
    <div class="stat-num">95%</div>
    <div class="stat-label">OFFER ACCEPTANCE</div>
  </div>
  <div class="stat-line"></div>

  <div>
    <div class="stat-num">40%</div>
    <div class="stat-label">HIRING EFFICIENCY</div>
  </div>
  <div class="stat-line"></div>

  <div>
    <div class="stat-num">20%</div>
    <div class="stat-label">DIVERSITY IMPACT</div>
  </div>
</div>

<!-- YOUR 3D -->
<script type="module" src="./assets/index-DOz4Mzd6.js"></script>

<!-- PARTICLES SCRIPT -->
<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let w,h,particles=[];

function resize(){
  w=canvas.width=window.innerWidth;
  h=canvas.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

for(let i=0;i<60;i++){
  particles.push({
    x:Math.random()*w,
    y:Math.random()*h,
    vx:(Math.random()-0.5)*0.3,
    vy:(Math.random()-0.5)*0.3,
    size:Math.random()*2
  });
}

function animate(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="rgba(40,170,255,0.6)";
  particles.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    if(p.x<0||p.x>w) p.vx*=-1;
    if(p.y<0||p.y>h) p.vy*=-1;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();
</script>

<!-- CURSOR AURA -->
<script>
const aura=document.getElementById("aura");
document.addEventListener("mousemove",e=>{
  aura.style.left=e.clientX+"px";
  aura.style.top=e.clientY+"px";
});
</script>

<!-- TILT EFFECT -->
<script>
const stats=document.getElementById("side-stats");
document.addEventListener("mousemove",(e)=>{
  const x=(e.clientX/window.innerWidth-0.5)*20;
  const y=(e.clientY/window.innerHeight-0.5)*20;
  stats.style.transform=`translateY(-50%) rotateX(${y}deg) rotateY(${x}deg)`;
});
</script>

<!-- COUNT UP -->
<script>
function animateValue(el,start,end,duration){
  let startTime=null;
  function update(time){
    if(!startTime) startTime=time;
    const progress=Math.min((time-startTime)/duration,1);
    const value=Math.floor(progress*(end-start)+start);
    el.textContent=value+(el.dataset.suffix||"");
    if(progress<1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

window.addEventListener("load",()=>{
  document.querySelectorAll(".stat-num").forEach(el=>{
    const raw=el.textContent.replace(/\D/g,"");
    const val=parseInt(raw||"0");
    const suffix=el.textContent.replace(/[0-9]/g,"");
    el.textContent="0";
    el.dataset.suffix=suffix;
    animateValue(el,0,val,1200);
  });
});
</script>

</body>
</html>

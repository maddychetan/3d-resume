<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chetan Holiyappa | 3D Resume</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #fff; }
    canvas { display: block; }
    #header { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; pointer-events: none; }
    #header h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.15em; background: linear-gradient(90deg, #4488ff, #ff6622); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #header p { font-size: 0.85rem; color: #88aacc; letter-spacing: 0.2em; margin-top: 4px; }
    #hint { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); font-size: 0.75rem; color: #445566; letter-spacing: 0.15em; z-index: 10; pointer-events: none; }
    #labels { display: none; }
    #panel { position: fixed; top: 50%; right: -420px; transform: translateY(-50%); width: 380px; max-height: 80vh; background: rgba(10,15,30,0.95); border: 1px solid rgba(68,136,255,0.3); border-radius: 12px; padding: 28px; overflow-y: auto; z-index: 100; transition: right 0.4s cubic-bezier(0.22,1,0.36,1); backdrop-filter: blur(12px); }
    #panel.active { right: 24px; }
    #close-btn { position: absolute; top: 12px; right: 16px; background: none; border: none; color: #88aacc; font-size: 1.4rem; cursor: pointer; }
    #close-btn:hover { color: #fff; }
    #panel-content h2 { font-size: 1.3rem; margin-bottom: 16px; background: linear-gradient(90deg, #4488ff, #22cc88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.05em; }
    #panel-content p { font-size: 0.82rem; color: #aabbcc; line-height: 1.7; margin-bottom: 10px; }
    #panel-content .item { font-size: 0.82rem; color: #ccddef; margin-bottom: 6px; padding: 8px 10px; background: rgba(68,136,255,0.07); border-left: 2px solid #4488ff; border-radius: 4px; }
    #panel-content .item span { float: right; color: #4488ff; font-size: 0.75rem; }
    #panel-content strong { color: #fff; }
    .skills-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .skills-grid span { background: rgba(68,136,255,0.12); border: 1px solid rgba(68,136,255,0.3); color: #88ccff; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; }
  </style>
</head>
<body>
  <div id="header">
    <h1>CHETAN HOLIYAPPA</h1>
    <p>STRATEGIC TALENT PARTNER &middot; 10+ YEARS</p>
  </div>
  <div id="hint">CLICK A CARD TO EXPLORE &middot; DRAG TO ROTATE &middot; SCROLL TO ZOOM</div>
  <div id="labels"></div>
  <div id="panel">
    <button id="close-btn">X</button>
    <div id="panel-content"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>

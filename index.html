<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chetan | 3D Resume</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background:#060612;
      font-family: 'Segoe UI', sans-serif;
      overflow:hidden;
      color:#fff;
    }

    #panel {
      position:fixed;
      top:50%;
      right:-420px;
      transform:translateY(-50%);
      width:380px;
      max-height:80vh;
      padding:24px;
      border-radius:12px;
      background:rgba(10,15,30,0.95);
      backdrop-filter:blur(12px);
      border:1px solid rgba(68,136,255,0.3);
      transition:0.4s ease;
      overflow-y:auto;
      z-index:100;
    }

    #panel.active { right:20px; }

    #close-btn {
      position:absolute;
      right:12px;
      top:8px;
      background:none;
      border:none;
      color:#aaa;
      font-size:18px;
      cursor:pointer;
    }

    /* PREMIUM PANEL UI */
    .panel-header {
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:16px;
    }

    .panel-icon {
      font-size:26px;
      padding:10px;
      border-radius:10px;
      background:rgba(68,136,255,0.1);
    }

    .subtitle {
      font-size:12px;
      color:#88aacc;
    }

    .contact-row {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin:12px 0;
    }

    .contact-row a {
      padding:8px 14px;
      border-radius:8px;
      text-decoration:none;
      color:#cfe6ff;
      font-size:12px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(68,136,255,0.2);
      transition:0.3s ease;
    }

    .contact-row a:hover {
      transform:translateY(-2px);
      background:rgba(68,136,255,0.15);
      box-shadow:0 0 12px rgba(68,136,255,0.4);
    }

    .tag-row {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .tag {
      font-size:11px;
      padding:4px 10px;
      border-radius:20px;
      background:rgba(34,204,136,0.1);
      border:1px solid rgba(34,204,136,0.3);
      color:#88ffcc;
    }

    @media (max-width:768px){
      #panel { width:90%; right:-100%; }
      #panel.active { right:5%; }
    }

  </style>
</head>

<body>

<div id="panel">
  <button id="close-btn">✖</button>
  <div id="panel-content"></div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>

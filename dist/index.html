<style>
:root {
  --blue: #2aaaff;
}

body {
  margin: 0;
  background: #050814;
  color: #fff;
  font-family: 'Orbitron', sans-serif;
  overflow: hidden;
}

/* ================= HEADER ================= */

#header {
  position: absolute;
  top: 20px;
  left: 40px;
}

#header h1 {
  font-size: 2.8rem;
  letter-spacing: 0.35em;
  color: #ffffff;
  font-weight: 800;
  text-shadow: 0 0 12px rgba(255,255,255,0.25);
  margin: 0;
}

.header-sub {
  font-size: 0.8rem;
  letter-spacing: 0.35em;
  color: rgba(255,255,255,0.85);
  margin-top: 6px;
}

.header-status {
  font-size: 0.7rem;
  letter-spacing: 0.25em;
  color: rgba(255,255,255,0.75);
  margin-top: 6px;
}

/* ================= SIDE STATS ================= */

#side-stats {
  position: absolute;
  left: 40px;
  top: 200px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.stat-num {
  font-size: 1.8rem;
  font-weight: 900;
  background: linear-gradient(180deg, var(--blue), rgba(40,170,255,0.3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 12px rgba(40,170,255,0.4);
}

.stat-label {
  font-size: 0.55rem;
  letter-spacing: 0.18em;
  margin-top: 4px;
}

/* ================= PANEL ================= */

#panel {
  position: fixed;
  right: -400px;
  top: 50%;
  transform: translateY(-50%);
  width: 320px;
  background: #111;
  padding: 20px;
  transition: 0.4s;
  border-left: 2px solid var(--blue);
}

#panel.active {
  right: 0;
}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

  #header {
    left: 20px;
  }

  #header h1 {
    font-size: 1.6rem;
    letter-spacing: 0.2em;
  }

  #side-stats {
    display: none;
  }

  #panel {
    width: 100%;
    height: 100%;
    top: 0;
    transform: none;
  }
}

</style>

</head>
